# fly.toml app configuration file generated for easy-ticket-api on 2026-04-29T18:04:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'easy-ticket-api'
primary_region = 'gru'

[build]

[deploy]
  release_command = "node node_modules/typeorm/cli.js migration:run -d dist/common/database/data-source.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # ON-SALE SETTING (2026-07-27): kept warm for the sale on 2026-07-28 so the
  # first buyers of the drop don't pay a cold start. Costs machine-seconds for
  # as long as it stays at 1 — revert to 0 after the sale to let it sleep again.
  #
  # Deliberately NOT running `fly scale count 2`: the app assumes a single
  # instance in two places — the in-process payment cache and the per-minute
  # `orders:expire-stale` cron (see orders.service.ts). A second machine would
  # duplicate that cron against inventory rows the checkout path also locks.
  min_machines_running = 1
  processes = ['app']

  # Liveness only — deliberately not /health/db. A DB-touching check on this
  # interval would keep the Neon compute permanently awake and burn the free
  # plan's monthly compute-hour quota.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

# ON-SALE SETTING (2026-07-27): raised to 1024 for the 2026-07-28 sale.
# 512MB alongside a 50-connection pool is thin, and an OOM doesn't degrade a
# single request — it kills the machine mid-sale. The app fixes (pool sizing,
# email/QR off the request path, indexes) still do the heavy lifting; this is
# headroom, not a substitute for them. Revert to 512 after the sale.
[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024
