# fly.toml app configuration file generated for easy-ticket-api on 2026-04-29T18:04:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'easy-ticket-api'
primary_region = 'gru'

[build]

[deploy]
  release_command = "node node_modules/typeorm/cli.js migration:run -d dist/common/database/data-source.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # RECOMMENDATION for high-traffic on-sales (has a cost impact, left unchanged):
  #   min_machines_running = 1     # avoid a cold start when a drop opens
  #   and run `fly scale count 2` (or configure autoscaling) ahead of the sale.
  min_machines_running = 0
  processes = ['app']

# RECOMMENDATION for ~100 concurrent purchases (cost impact — left unchanged):
#   memory_mb = 1024   # 512MB is thin headroom under a burst
# The app fixes (pool sizing, email/QR off the request path, indexes) do the
# heavy lifting; bump the machine only if you still see memory pressure / OOM.
[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 512
